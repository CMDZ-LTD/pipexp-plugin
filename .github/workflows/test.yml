name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # GitHub-hosted: free for a public repo, and a fork's pull request never runs on our own machines.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@pipexp.dev && git config --global user.name ci
      - run: npm test

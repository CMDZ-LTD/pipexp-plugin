name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Any PipeXP runner: omarchy's native ones, or the M4's Docker ones (agent-pipeline docs/ci-runners.md).
    runs-on: [self-hosted, pipexp]
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@pipexp.dev && git config --global user.name ci
      - run: npm test

name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Linux containers on Derek's M4 (agent-pipeline docs/ci-runners.md). Back to GitHub: ubuntu-latest.
    runs-on: [self-hosted, m4]
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@pipexp.dev && git config --global user.name ci
      - run: npm test
